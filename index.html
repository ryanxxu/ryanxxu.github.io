<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ryan's Space</title>
<!-- 這是依你的入口頁截圖重建的版本。若你原本的 index.html 已經有了，不用覆蓋，
     只要把「Hokkaido」卡片的連結改成 travel/ 或 travel/hokkaido-2026/ 即可。 -->
<style>
:root{--bg:#f4f4f1;--ink:#1d2b22;--sage:#dfe9df;--mut:#7a857d;--bd:#e7e9e4}
*{box-sizing:border-box}
html{scrollbar-gutter:stable}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
.w{max-width:1012px;margin:0 auto;padding:30px 16px 24px}
.top{display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.06em;font-size:14px}
.logo i{width:36px;height:36px;border-radius:10px;background:var(--sage);display:grid;place-items:center;font-style:normal;font-size:16px}
.top small{letter-spacing:.14em;font-size:11px;color:var(--mut)}
.hero{margin-top:30px;position:relative;overflow:hidden;background:#dfebe1;border-radius:26px;min-height:300px;display:flex;align-items:center;padding:57px 64px;isolation:isolate}
.hero:before{content:"";position:absolute;z-index:-1;width:370px;height:370px;border:1px solid #fff9;border-radius:50%;right:-75px;top:-95px;box-shadow:0 0 0 70px #ffffff24,0 0 0 140px #ffffff16}
.hero:after{content:"✳";position:absolute;right:108px;bottom:30px;font-size:116px;color:#6c9a79;opacity:.3;transform:rotate(-15deg)}
.eyebrow{font-size:12px;letter-spacing:.22em;font-weight:800;color:#62846d;margin:0 0 18px}
.hero h1{font-size:clamp(34px,5vw,54px);line-height:1.2;letter-spacing:-.035em;margin:0 0 16px;font-weight:800}
.intro{font-size:15px;line-height:1.9;margin:0;color:#5a7260;max-width:450px}
h2{display:flex;align-items:center;gap:12px;font-size:22px;margin:52px 0 16px}
h2 i{width:38px;height:38px;border-radius:10px;background:var(--sage);display:grid;place-items:center;font-style:normal;font-size:16px}
h2 small{margin-left:auto;font-size:12px;font-weight:400;color:var(--mut);letter-spacing:.04em}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.c{background:#fff;border:1px solid var(--bd);border-radius:18px;padding:24px;text-decoration:none;color:inherit;position:relative;min-height:210px;display:flex;flex-direction:column}
.c .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:#eef1ea}
.c .ar{position:absolute;right:24px;top:24px;width:28px;height:28px;border:1px solid var(--bd);border-radius:50%;display:grid;place-items:center;font-size:12px;color:#44665c}
.c h3{margin:22px 0 2px;font-size:18px}
.c p{margin:0;font-size:12px;color:var(--mut)}
.c em{margin-top:auto;font-style:normal;font-size:11px;font-weight:700;letter-spacing:.1em;color:#58715f}
.c.off{opacity:.75;pointer-events:none}
footer{display:flex;justify-content:space-between;border-top:1px solid var(--bd);margin-top:56px;padding-top:20px;font-size:12px;color:var(--mut)}
@media(max-width:780px){.hero{padding:48px 38px}.hero:after{right:28px;font-size:80px}}
@media(max-width:760px){.g{grid-template-columns:1fr}}
@media(max-width:540px){.hero{min-height:255px;padding:38px 27px;border-radius:20px}.hero:after{right:-3px;bottom:6px;font-size:70px}.intro{font-size:14px;max-width:250px}}
</style>
</head>
<body>
<div class="w">
  <div class="top"><div class="logo"><i>R.</i>RYAN'S SPACE</div><small>PERSONAL WEBSITE</small></div>
  <section class="hero"><div><p class="eyebrow">RYAN'S SPACE</p><h1>我的網站</h1><p class="intro">整理了一些旅行紀錄和個人作品。<br>可以從下方選擇想看的內容。</p></div></section>
  <h2><i>🧳</i>旅行紀錄<small id="tc"></small></h2><div class="g" id="travel"></div>
  <h2><i>✦</i>個人作品<small id="pc"></small></h2><div class="g" id="proj"></div>
  <footer><span>© 2026 Ryan's Space</span><span>Personal website</span></footer>
</div>
<script>
/* 新增卡片只要在這兩個陣列加一筆。href 留空（''）代表尚未完成（卡片變淡且不能點）。 */
var TRAVEL=[
  {icon:'<svg width="30" height="20" viewBox="0 0 30 20" style="border-radius:3px;box-shadow:0 0 0 1px #dfe3dc"><rect width="30" height="20" fill="#fff"/><circle cx="15" cy="10" r="6" fill="#bc002d"/></svg>',name:'Hokkaido',desc:'20261119-20261123',href:'travel/'},,
  {icon:'⛰️',name:'旅遊 2',desc:'旅行照片與紀錄。',href:''},
  {icon:'🏞️',name:'旅遊 3',desc:'旅行照片與紀錄。',href:''}
];
var PROJ=[
  {icon:'🎨',name:'作品 4',desc:'個人製作的作品。',href:'',bg:'#eaeefb'},
  {icon:'💡',name:'作品 5',desc:'個人製作的作品。',href:'',bg:'#eaeefb'}
];
function z(n){return (n<10?'0':'')+n}
function draw(id,arr,label,off){
  document.getElementById(id).innerHTML=arr.map(function(x,i){
    return '<a class="c'+(x.href?'':' off')+'"'+(x.href?' href="'+x.href+'"':'')+'><div class="ic"'+(x.bg?' style="background:'+x.bg+'"':'')+'>'+x.icon+'</div><span class="ar">↗</span><h3>'+x.name+'</h3><p>'+x.desc+'</p><em>'+label+' '+z(i+1+off)+'</em></a>';
  }).join('');
}
draw('travel',TRAVEL,'TRAVEL',0);draw('proj',PROJ,'PROJECT',TRAVEL.length);
document.getElementById('tc').textContent='TRAVEL · '+z(TRAVEL.length);document.getElementById('pc').textContent='PROJECTS · '+z(PROJ.length);
</script>
</body>
</html>
