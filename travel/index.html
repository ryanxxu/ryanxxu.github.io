<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>旅行紀錄｜Ryan's Space</title>
<style>
:root{--bg:#f4f4f1;--ink:#1d2b22;--sage:#dfe9df;--mut:#7a857d;--bd:#e7e9e4}
*{box-sizing:border-box}
html{scrollbar-gutter:stable}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
a{color:inherit;text-decoration:none}
.w{max-width:1012px;margin:0 auto;padding:30px 16px 24px}
.top{display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.06em;font-size:14px}
.logo i{width:36px;height:36px;border-radius:10px;background:var(--sage);display:grid;place-items:center;font-style:normal;font-size:16px}
.top small{letter-spacing:.14em;font-size:11px;color:var(--mut)}
.top a.back{letter-spacing:.14em;font-size:11px;color:var(--mut)}
.hero{margin-top:30px;position:relative;overflow:hidden;background:#dfebe1;border-radius:26px;min-height:300px;display:flex;align-items:center;padding:57px 64px;isolation:isolate}
.hero:before{content:"";position:absolute;z-index:-1;width:370px;height:370px;border:1px solid #fff9;border-radius:50%;right:-75px;top:-95px;box-shadow:0 0 0 70px #ffffff24,0 0 0 140px #ffffff16}
.hero:after{content:"✳";position:absolute;right:108px;bottom:30px;font-size:116px;color:#6c9a79;opacity:.3;transform:rotate(-15deg)}
.eyebrow{font-size:12px;letter-spacing:.22em;font-weight:800;color:#62846d;margin:0 0 18px}
.hero h1{font-size:clamp(34px,5vw,54px);line-height:1.2;letter-spacing:-.035em;margin:0 0 16px;font-weight:800}
.intro{font-size:15px;line-height:1.9;margin:0;color:#5a7260;max-width:450px}
h2{display:flex;align-items:center;gap:12px;font-size:22px;margin:52px 0 16px}
h2 i{width:38px;height:38px;border-radius:10px;background:var(--sage);display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:800;color:#58715f;letter-spacing:.02em}
h2 small{margin-left:auto;font-size:12px;font-weight:400;color:var(--mut);letter-spacing:.04em}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.c{background:#fff;border:1px solid var(--bd);border-radius:18px;padding:24px;color:inherit;position:relative;min-height:210px;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s,border-color .2s}
.c:hover{transform:translateY(-5px);border-color:#b5c9ba;box-shadow:0 14px 35px #203c2510}
.c .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:#eef1ea}
.c .ar{position:absolute;right:24px;top:24px;width:28px;height:28px;border:1px solid var(--bd);border-radius:50%;display:grid;place-items:center;font-size:12px;color:#44665c}
.c h3{margin:22px 0 2px;font-size:18px}
.c p{margin:0;font-size:12px;color:var(--mut)}
.c .row{margin-top:auto;padding-top:18px;display:flex;align-items:center;justify-content:space-between}
.c em{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.1em;color:#58715f}
.st{font-size:11px;font-weight:700;border-radius:999px;padding:2px 10px;background:#58715f;color:#fff}
.st.soon{background:#e9edf5;color:#7585a6}
.st.done{background:#eef1ea;color:#7a857d}
footer{display:flex;justify-content:space-between;border-top:1px solid var(--bd);margin-top:56px;padding-top:20px;font-size:12px;color:var(--mut)}
@media(max-width:780px){.g{grid-template-columns:repeat(2,1fr)}.hero{padding:48px 38px}.hero:after{right:28px;font-size:80px}}
@media(max-width:540px){.g{grid-template-columns:1fr}.hero{min-height:255px;padding:38px 27px;border-radius:20px}.hero:after{right:-3px;bottom:6px;font-size:70px}.intro{font-size:14px;max-width:250px}}
</style>
</head>
<body>
<div class="w">
  <div class="top"><a class="logo" href="../"><i>R.</i>RYAN'S SPACE</a><a class="back" href="../">← 回首頁</a></div>
  <section class="hero"><div><p class="eyebrow">TRAVEL</p><h1>旅行紀錄</h1><p class="intro">依年份整理每一趟旅程。<br>選擇一趟旅行，查看每日行程。</p></div></section>
  <div id="list"></div>
  <footer><span>© 2026 Ryan's Space</span><span>Personal website</span></footer>
</div>
<script src="trips.js"></script>
<script>
(function(){
  var now=new Date(),p=function(n){return ('0'+n).slice(-2)};
  var t=now.getFullYear()+'-'+p(now.getMonth()+1)+'-'+p(now.getDate());
  var f=function(s){return s.replace(/-/g,'/')};
  var trips=(window.TRIPS||[]).slice().sort(function(a,b){return a.start<b.start?1:-1});
  var years=[];trips.forEach(function(x){var y=x.start.slice(0,4);if(years.indexOf(y)<0)years.push(y)});
  var n=0,total=trips.length;
  document.getElementById('list').innerHTML=years.map(function(y){
    var list=trips.filter(function(x){return x.start.slice(0,4)===y});
    var cards=list.map(function(x){
      var st=t>=x.start&&t<=x.end?'<span class="st">進行中</span>':t<x.start?'<span class="st soon">即將出發</span>':'<span class="st done">已結束</span>';
      return '<a class="c" href="'+x.folder+'/"><div class="ic">'+(x.icon||x.emoji||'✈️')+'</div><span class="ar">↗</span><h3>'+x.name+'</h3><p>'+f(x.start)+' – '+f(x.end)+'</p><div class="row"><em>TRAVEL '+p(total-(n++))+'</em>'+st+'</div></a>';
    }).join('');
    return '<h2>'+y+' 年<small>'+list.length+' 趟旅程</small></h2><div class="g">'+cards+'</div>';
  }).join('')||'<p style="color:#7a857d;margin-top:40px">還沒有旅程</p>';
})();
</script>
</body>
</html>
